version: '3.8'

services:
  file-upload-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: file-upload-download-app
    ports:
      - "8100:8100"
    volumes:
      # Mount direktori uploads ke host agar file persisten
      - ./uploads:/app/uploads
      # Mount untuk development (optional - uncomment jika ingin development mode)
      # - .:/app
      # - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=8100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8100"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Tambah volume untuk persistent data
volumes:
  uploads_data:
    driver: local