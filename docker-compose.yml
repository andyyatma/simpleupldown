services:
  file-upload-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-upload-download-app
    user: "1001:1001"
    ports:
      - "8100:8100"
    volumes:
      # Mount direktori uploads ke host agar file persisten
      - ./uploads:/app/uploads
      # Mount untuk development (optional - uncomment jika ingin development mode)
      # - .:/app
      # - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=8100
      - UV_THREADPOOL_SIZE=128
      - NODE_OPTIONS=--max-old-space-size=4096
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8100",
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

# Optional: Tambah volume untuk persistent data
volumes:
  uploads_data:
    driver: local
